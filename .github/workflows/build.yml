name: Build clients
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.target == 'apk'
      - run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'
        if: matrix.target == 'apk'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: lan-iperf-${{ matrix.target }}
          path: |
            build/windows/x64/runner/Release/
            build/app/outputs/flutter-apk/app-release.apk
